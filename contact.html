    <main class="main-container">


        <section class="contact-section">

            <h1>
                Contact Me
            </h1>

            <p class="contact-intro">
                You can use the form below to contact me.
            </p>


            <!--
                This form is only a placeholder.
                No backend server is connected yet.
            -->

            <form action="#"
                  method="post"
                  class="contact-form">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullname">

                        Full Name
                        <span class="required">*</span>

                    </label>

                    <input type="text"
                           id="fullname"
                           name="fullname"
                           required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        Email
                        <span class="required">*</span>

                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           required>

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input type="text"
                           id="subject"
                           name="subject">

                </div>


                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">

                        Message
                        <span class="required">*</span>

                    </label>

                    <textarea id="message"
                              name="message"
                              rows="8"
                              required></textarea>

                </div>


                <!-- CONTACT METHOD -->

                <fieldset class="contact-options">

                    <legend>
                        Preferred Contact Method
                    </legend>


                    <label class="option-label">

                        <input type="radio"
                               id="contact-email"
                               name="contact-method"
                               value="email">

                        Email

                    </label>


                    <label class="option-label">

                        <input type="radio"
                               id="contact-phone"
                               name="contact-method"
                               value="phone">

                        Phone

                    </label>

                </fieldset>


                <!-- CONSENT -->

                <div class="consent-group">

                    <label>

                        <input type="checkbox"
                               id="consent"
                               name="consent">

                        I agree to be contacted

                    </label>

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <input type="submit"
                           value="Send">

                    <input type="reset"
                           value="Reset">

                </div>


            </form>

        </section>
